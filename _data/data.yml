career-profile:
  title: Profil
  summary: |
    🎯 **SÖKER LIA-PLATS (2026)** - .NET Systemutvecklare under utbildning på 
    Borås Yrkeshögskola med stark passion för backend-utveckling och problemlösning.
    
    I september 2025 påbörjade jag min omställning från industri till .NET-utveckling. 
    Med 13+ års erfarenhet från betongproduktion och svets/metallproduktion (sedan 2012) 
    tar jag med mig värdefulla kompetenser: systematisk problemlösning, precision, 
    teamarbete och förmågan att arbeta strukturerat under press.
    
    **Varför jag blir en bra LIA-student:**
    - Extrem arbetsmoral och driv att lära (kodar dagligen utanför lektionstid)
    - Ödmjuk men ambitiös - tar emot feedback och ser mentorskap som ovärderligt
    - Praktisk problemlösare som inte ger upp vid utmaningar
    - Genuint passionerad för programmering och systemutveckling
    
    **Vad jag söker:** En LIA-plats där jag får arbeta med erfarna utvecklare, 
    bidra till riktiga projekt och fortsätta växa inom .NET-ekosystemet. Jag är 
    redo att lägga ner tid och energi för att bli en värdefull teammedlem.
education:
  title: 🎓 Utbildning - Mitt Fokus
  info:
  - degree: ⭐ .NET Systemutvecklare (PÅGÅENDE - SÖKER LIA 2026)
    university: Borås Yrkeshögskola
    time: Sep 2025 - Jun 2027 | Termin 1 av 4
    details: |
      **DETTA ÄR MIN HUVUDFOKUS** - Intensiv 2-årig yrkeshögskoleutbildning inom 
      modern .NET-utveckling med inriktning backend och systemarkitektur.
      
      📚 **Termin 1 (Sep-Dec 2025) - Aktuella studier:**
        ✓ C# Fundamentals och Objektorienterad Programmering
        ✓ Programmeringslogik, algoritmer och datastrukturer
        ✓ Git, GitHub och versionhantering
        ✓ SQL och relationsdatabaser (queries, design, normalisering)
        ✓ Debugging, felsökning och problemlösningsmetodik
        ✓ Visual Studio & VS Code utvecklingsmiljöer
      
      🚀 **Termin 2-3 (2026) - Kommande:**
        ▶ Fördjupad C# och .NET 8/9
        ▶ ASP.NET Core, Web API och RESTful services
        ▶ Entity Framework Core och avancerad databasdesign
        ▶ Design patterns och systemarkitektur
        ▶ Azure Cloud Services och deployment
        ▶ Testdriven utveckling (TDD) och CI/CD
        ▶ Agila metoder (Scrum/Kanban)
      
      💼 **LIA-PERIODER (2026-2027):**
      Utbildningen inkluderar två LIA-perioder där jag kommer arbeta i verkliga 
      utvecklingsteam. Detta är vad jag ser mest fram emot - att applicera mina 
      kunskaper i riktiga projekt och lära från erfarna utvecklare.
      
      💡 **Min dedikation:** Utöver lektionstid spenderar jag kvällar och helger 
      med att koda egna projekt (se nedan), lösa kodutmaningar och fördjupa mig i 
      .NET-ekosystemet. Programmering är inte bara en utbildning för mig - det är 
      min passion.
      
  - degree: International Welding – IW Svets
    university: Marks Gymnasium, Skene
    time: 
    details: |
      Yrkesutbildning inom avancerad svetsning med inriktning på TIG/MMA och MIG/MAG 
      på stål, plåt och rör. Utbildningen betonade precision, metodisk arbetsgång och 
      höga kvalitetskrav.
      
      Kompetenser som är överförbara till programmering:
        - Teknisk dokumentation och ritningsläsning (liknar kodläsning)
        - Extrem noggrannhet och detaljorientering (debugging mindset)
        - Metodiskt arbetssätt vid problemlösning
        - Hantering av strikta kvalitetskrav och standarder

experiences:
  title: Arbetslivserfarenhet
  intro: |
    13+ år (sedan 2012) inom betongproduktion och svets/metallproduktion har format mig 
    till en systematisk problemlösare med stark arbetsmoral och bred branscherfarenhet. 
    September 2025 valde jag att följa min passion och börja studera .NET-utveckling heltid.
  info:
  - role: Gjutare & Maskinist
    time: Jun 2019 - Sep 2025 (6 år)
    company: Tranemo Prefab - Betongproduktion
    details: |
      Produktion av prefabricerade betongelement med operativt ansvar för 
      materialflöde, kvalitet och leverans. Lämnade för att följa min passion för programmering.
      
      **Överförbara kompetenser:** Systematisk problemlösning (root cause analysis), 
      arbeta under tidspress, kvalitetsfokus, teamarbete, teknisk dokumentation.
      
  - role: Svetsare | Driftledare | Montör
    time: 2012 - 2019 (7 år)
    company: Specma Hydraulic, ABAS Protect, m.fl. - Svets/Metallproduktion
    details: |
      Olika roller inom svets, metallproduktion och operativ ledning sedan 19 års ålder. 
      Arbetade med strikta kvalitetskrav (nolltolerans), personalansvar och processledning. 
      Bred erfarenhet av hydraulikkomponenter, industriell svetsning och produktionsledning.
      
      **Nyckelkompetenser:** Precision, ledarskap, planering, anpassningsförmåga 
      och metodiskt arbete.

